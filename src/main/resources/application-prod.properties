spring.application.name=ai-agent-service
server.port=8080

# ── CORS ──
# Override for production; never ship development origins in prod deployments.
# app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://your-production-domain.com}

# ── Database (PostgreSQL for production) ──
# Override these via environment variables / secrets manager:
# SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD
spring.datasource.url=jdbc:postgresql://localhost:5432/aiagent
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:aiagent}
spring.datasource.password=${DB_PASSWORD:aiagent}

# Connection pool tuning for high concurrency
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:40}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN:10}
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.pool-name=AiAgentHikariPool

# JPA: never auto-mutate schema in prod; use Flyway migrations
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# ── JWT ──
# JWT_SECRET is REQUIRED in every environment (fail-fast validation in JwtUtil).
# There is no shipped default; set a strong random Base64 value.
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-ms=86400000

# ── OpenCode ──
ai.opencode.url=${OPENCODE_URL:http://localhost:4096}
ai.opencode.port=4096
ai.opencode.auto-install=false
# Use async AI job processing in production (no HTTP threads blocked on inference)
ai.opencode.async=${AI_ASYNC:true}

# ── Redis (optional, used when REDIS_HOST is set) ──
redis.host=${REDIS_HOST:}
redis.port=${REDIS_PORT:6379}

# ── Async job thread pool (AI request processing) ──
app.async.core-pool-size=${APP_ASYNC_CORE:16}
app.async.max-pool-size=${APP_ASYNC_MAX:64}
app.async.queue-capacity=${APP_ASYNC_QUEUE:10000}

# Cache TTL in seconds for the AI job status / user-lookup cache
app.cache.user-ttl-seconds=300

# User-lookup cache TTL (seconds) used by the auth filter
app.security.user-cache-ttl-seconds=${USER_CACHE_TTL:60}

# Per-user rate limit (requests per minute; 0 = disabled)
app.security.rate-limit-per-minute=${RATE_LIMIT_PER_MINUTE:60}

# AI-generated welcome suggestions cache TTL (seconds)
app.suggestions-cache-ttl-seconds=${SUGGESTIONS_CACHE_TTL:600}

# ── Logging ──
logging.level.com.development.agent=INFO
logging.level.org.springframework=WARN
logging.level.org.springframework.security=INFO
