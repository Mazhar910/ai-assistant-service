spring.application.name=ai-agent-service
server.port=8080
# Wait for in-flight requests (and let the async SSE heartbeat/job machinery wind
# down via @PreDestroy) before shutting down, instead of dropping connections mid-flight.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# ── Actuator ──
# Health + readiness/liveness probes for orchestrators; metrics for observability.
# Info-only by default; keep sensitive actuator endpoints closed to the network.
management.endpoints.web.exposure.include=health,info,metrics,ready,liveness
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true


# ── Database ──
spring.datasource.url=jdbc:h2:mem:aiagent;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
# No Open Session In View: all lazy-loading must happen inside @Transactional/TransactionTemplate
# scopes (ownership checks use a narrow EXISTS query), never on the async worker or MVC threads.
spring.jpa.open-in-view=false
# H2 console is OFF unless explicitly enabled (H2_CONSOLE_ENABLED=true for local dev).
# It is only ever reachable from localhost (web-allow-others=false).
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:false}
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false
# Mirrors H2_CONSOLE_ENABLED; gates the permitAll() matcher in SecurityConfig.
app.h2-console-enabled=${H2_CONSOLE_ENABLED:false}

# ── JWT ──
# JWT_SECRET is REQUIRED: the app refuses to start without it (JwtUtil validates
# length at construction). There is intentionally NO working default here.
# Generate a fresh random Base64 value, e.g.:
#   node -e "console.log(Buffer.from(require('crypto').randomBytes(48)).toString('base64'))"
# or:  openssl rand -base64 48
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-ms=86400000
# Refresh tokens live longer than access tokens and are exchanged at /api/auth/refresh.
app.jwt.refresh-expiration-ms=604800000

# Initial admin bootstrap account (only created when no ADMIN exists yet).
# ADMIN_PASSWORD is REQUIRED to bootstrap an admin: the app fails fast at startup
# rather than provisioning a default/known credential. ADMIN_USERNAME/ADMIN_EMAIL
# are optional (the email defaults to <username>@localhost).
app.initial-admin.username=${ADMIN_USERNAME:admin}
app.initial-admin.password=${ADMIN_PASSWORD:}
app.initial-admin.email=${ADMIN_EMAIL:}

# ── OpenCode ──
ai.opencode.url=http://localhost:4096
ai.opencode.port=4096
ai.opencode.auto-install=true
# Process AI requests asynchronously (no HTTP threads blocked on upstream inference)
ai.opencode.async=true

# Ordered model chain, most capable first. Chat turns start with the first model;
# on an HTTP 429 rate-limit error the service shifts automatically to the next one.
ai.opencode.models=opencode/big-pickle,opencode/ling-3.0-flash-fin-free,opencode/mimo-v2.5-free,opencode/nemotron-3-ultra-free,opencode/nemotron-3.5-lightning-free,opencode/muse-spark-1.2-contributor-free

# After a model returns HTTP 429 (rate limit), skip it (and anything more capable)
# for this many seconds so the shift is sticky across turns, not re-attempted each message.
ai.opencode.rate-limit-cooldown-seconds=300

# ── Async AI job thread pool ──
app.async.core-pool-size=8
app.async.max-pool-size=32
app.async.queue-capacity=5000
# Retry transient rate-limit (HTTP 429) failures up to this many attempts, with backoff.
app.async.retry-max-attempts=3
app.async.retry-base-delay-ms=2000
# How long to keep completed/failed job records in memory before evicting them.
app.async.job-retention-hours=24

# Server-Sent Events for job status: how long a stream may stay open (seconds) and
# how often a heartbeat comment is pushed to keep idle connections alive.
app.async.sse-timeout-seconds=900
app.async.sse-heartbeat-seconds=15

# Cache TTL (seconds) for AI job status / user-lookup
app.cache.user-ttl-seconds=300

# User-lookup cache TTL (seconds) used by the auth filter
app.security.user-cache-ttl-seconds=60

# Rate limiting (requests per minute per user; 0 = disabled)
app.security.rate-limit-per-minute=60

# AI-generated welcome suggestions cache TTL (seconds)
app.suggestions-cache-ttl-seconds=600

# ── Crypto (application-layer encryption) ──
# Master switch: true = encrypt request/response bodies + auth header with AES-GCM
# (must match the frontend environment.cryptoEnabled). false = plaintext over TLS/JWT.
# The layer is otherwise an anti-pattern for streaming/compression and hides payloads
# from DevTools; keep it off unless it is genuinely required.
app.crypto.enabled=${CRYPTO_ENABLED:true}
# Session AES-key TTL (seconds)
app.crypto.session-ttl-seconds=3600
# Optional persistent RSA keypair path (e.g. {config}/crypto-keypair). When set, the
# server loads-or-generates and persists it so restarts do not invalidate sessions.
# Leave blank to use an in-memory keypair regenerated on every boot.
app.crypto.keypair-path=${CRYPTO_KEYPAIR_PATH:}

# CORS: comma-separated list of allowed browser origins. Override for production domains.
app.cors.allowed-origins=http://localhost:4200,http://127.0.0.1:4200,https://grammar-study-fitting-connectors.trycloudflare.com

# ── Logging ──
logging.level.com.development.agent=DEBUG
logging.level.org.springframework=INFO
logging.level.org.springframework.security=DEBUG
